services:
  frontend:
    container_name: hotelbooking-frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "3000:80"

  backend:
    container_name: hotelbooking-backend
    build: 
      context: ./backend
      dockerfile: HotelBooking.Api/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - mysql-db
      # - postgres-db
    env_file:
      - .env
    command: ["./scripts/wait-for-mysql.sh", "db", "dotnet", "HotelBooking.Api.dll"]

  mysql-db:
    container_name: hotelbooking-mysql-db
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - hotelbooking_mysql_data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hotelbooking-phpmyadmin
    depends_on:
      - mysql-db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${SERVER}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

