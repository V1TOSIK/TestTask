<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hotel Booking SPA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <script src="./components/globalStore.js"></script>
    <script src="./components/header.js"></script>
    <script src="./components/loginModal.js"></script>
    <script src="./components/asideSection.js"></script>
    <script src="./components/addModal.js"></script>
    <script src="./components/updateModal.js"></script>
    <script src="./components/bookingModal.js"></script>
</head>
<body class="bg-gray-100" x-data>

    <header x-data="header()" class="p-5 bg-[#474747] text-white flex justify-between items-center">
        <nav class="flex space-x-8 justify-center flex-1">
            <template x-for="tab in tabs" :key="tab">
                <button
                @click="setActiveTab(tab)"
                :class="getActiveTab() === tab
                ? 'border-b-2 border-blue-400 text-blue-400'
                : 'text-gray-200 hover:text-blue-300'"
                x-text="tab.charAt(0).toUpperCase() + tab.slice(1)"
                >
                </button>
            </template>
        </nav>

        <button
        x-show="!$store.globalState.currentUser.token"
        @click="open()"
        class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700 transition">
            Sign In / Sign Up
        </button>
        
        <button
        x-show="$store.globalState.currentUser.token"
        @click="logout()"
        class="bg-blue-600 font-semibold px-6 py-3 rounded hover:bg-blue-700 transition">
            Log Out
        </button>
    </header>

    <main class="py-1 grid grid-cols-1 lg:grid-cols-[250px_1fr] gap-6 min-h-screen">
        
        <aside x-data="asideSection" class="bg-white p-4 rounded shadow text-center">

            <h2 class="font-semibold mb-4 text-center border-b">Filters</h2>

            <template x-if="getActiveTab() === 'rooms' || getActiveTab() === 'hotels'" class="relative">
                <div class="relative shadow">
                    <label class="mb-1 font-medium text-grey-500 text-center">Cities</label>
                    <button 
                        @click="open = !open"
                        class="border px-3 py-1 rounded w-full text-left"
                    >
                        <template x-if="localFilteredCities.length === 0">
                            <span class="text-grey-300">Change cities</span>
                        </template>
                        <template x-if="localFilteredCities.length > 0">
                            <span class="text-grey-300" x-text="localFilteredCities.join(', ')"></span>
                        </template>
                    </button>
    
                    <div 
                        x-show="open"
                        @click.outside="open = false"
                        class="absolute left-0 w-full bg-white border mt-1 rounded shadow p-2 z-10"
                    >
                        <template x-for="city in cities" :key="city">
                            <label class="flex items-center space-x-2">
                                <input 
                                type="checkbox" 
                                :value="city"
                                x-model="localFilteredCities"
                                >
                                <span x-text="city"></span>
                            </label>
                        </template>
                    </div>
                </div>
            </template>
            <template x-if="getActiveTab() === 'rooms'">
                <div class="mt-3 shadow">
                    <label class="mb-1 font-medium text-grey-500 text-center">CheckIn Date</label>
                    <input type="date" x-model="localFilteredDate" class="w-full border text-grey-300 rounded px-2 py-1">
                </div>
            </template>

            <button
            type="submit"
            class="bg-blue-500 text-white rounded px-2 py-1 mt-3"
            @click="applyFilters()"
            >
                Apply
            </button>
        </aside>

        <section class="flex flex-col gap-4">

            <div x-data="addModal()" class="max-h-[100px] p-2 flex justify-end">
                <button
                x-show="$store.globalState.checkUserRole('Admin')"
                @click="open()"
                class="py-1 px-3 bg-green-600 text-white rounded hover:bg-green-700"
                >
                Add
                </button>
            </div>

           <div class="flex-1">

                <template x-if="$store.globalState.activeTab === 'hotels'">
                    <div x-init="$store.globalState.fetchHotels()"
                    class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6"
                    >
                        <template x-for="hotel in $store.globalState.hotels" :key="hotel.id">
                            <div class="p-4 bg-white rounded shadow">
                                <h2 class="font-semibold text-center" x-text="hotel.name"></h2>
                                <h4 class="text-gray-600">
                                    <span x-text="hotel.country"></span>,<span x-text="hotel.city"></span>
                                </h4>
                                <h5 class="text-gray-200" x-text="hotel.address"></h5>

                                <div x-show="$store.globalState.checkUserRole('Admin')" x-ref="updateModal" class="flex justify-between p-1 mt-2">
                                    <div x-data="updateModal()">
                                        <button
                                            class="px-2 py-1 bg-blue-500 text-white rounded"
                                            @click="open()">
                                        Update
                                        </button>
                                    </div>
                                    <div x-data="updateModal()">
                                        <button class="px-2 py-1 bg-red-500"
                                            @click="$store.globalState.deleteItem('hotels', hotel)">
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>

                       <div class="flex justify-center mt-4 space-x-2">
                            <button @click="$store.globalState.setPage('hotels', $store.globalState.hotelsPagination.page - 1)"
                                :disabled="$store.globalState.hotelsPagination.page === 1"
                                class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50">Prev</button>

                            <template x-for="i in $store.globalState.totalPages('hotels')" :key="i">
                                <button @click="$store.globalState.setPage('hotels', i)"
                                    :class="{'bg-blue-600 text-white': $store.globalState.hotelsPagination.page === i, 'bg-gray-300': $store.globalState.hotelsPagination.page !== i}"
                                    class="px-3 py-1 rounded">
                                    <span x-text="i"></span>
                                </button>
                            </template>

                            <button @click="$store.globalState.setPage('hotels', $store.globalState.hotelsPagination.page + 1)"
                                :disabled="$store.globalState.hotelsPagination.page === $store.globalState.totalPages('hotels')"
                                class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50">Next</button>
                        </div>
                   </div>
               </template>
       
               <template x-if="$store.globalState.activeTab === 'rooms'">
                   <div x-init="$store.globalState.fetchRooms()"
                   class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6">
                       <template x-for="room in $store.globalState.rooms" :key="room.id">
                            <div class="p-4 bg-white rounded shadow">
                                <h2 class="font-medium text-gray-100 text-center" x-text="room.hotelName"></h2>
                                <h2 class="font-semibold" x-text="room.number"></h2>
                                <p class="text-gray-600" x-text="room.capacity"></p>
                                <p class="text-gray-600" x-text="room.pricePerNight"></p>
                                    <div x-show="$store.globalState.checkUserRole('Admin')" x-ref="updateModal" class="flex justify-between p-1 mt-2">
                                        <div x-data="updateModal()">
                                            <button
                                                class="px-2 py-1 bg-blue-500 text-white rounded"
                                                @click="open()">
                                            Update
                                            </button>
                                        </div>
                                        <button class="px-2 py-1 bg-red-500"
                                            @click="$store.globalState.deleteItem('rooms', room)">
                                        Delete
                                        </button>
                                    </div>
                                    <div class="flex justify-center p-1 mt-2">
                                        <button x-show="$store.globalState.checkUserRole('User')"
                                            class="px-2 py-1 bg-green-600 text-white"
                                            @click="$store.globalState.openBookingModal(room.id)">
                                            Booking
                                        </button>
                                    </div>
                            </div>
                       </template>

                       <div class="flex justify-center mt-4 space-x-2">
                            <button @click="$store.globalState.setPage('rooms', $store.globalState.roomsPagination.page - 1)"
                                :disabled="$store.globalState.roomsPagination.page === 1"
                                class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50">Prev</button>

                            <template x-for="i in $store.globalState.totalPages('rooms')" :key="i">
                                <button @click="$store.globalState.setPage('rooms', i)"
                                    :class="{'bg-blue-600 text-white': $store.globalState.roomsPagination.page === i, 'bg-gray-300': $store.globalState.roomsPagination.page !== i}"
                                    class="px-3 py-1 rounded">
                                    <span x-text="i"></span>
                                </button>
                            </template>

                            <button @click="$store.globalState.setPage('rooms', $store.globalState.roomsPagination.page + 1)"
                                :disabled="$store.globalState.roomsPagination.page === $store.globalState.totalPages('rooms')"
                                class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50">Next</button>
                        </div>

                   </div>
               </template>
       
               <template x-if="$store.globalState.activeTab === 'bookings'">
                   <div x-init="$store.globalState.fetchBookings()"
                   class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6">
                       <template x-for="booking in $store.globalState.bookings" :key="booking.id">
                           <div class="p-4 bg-white rounded shadow">
                           <h2 class="font-semibold" x-text="booking.userName"></h2>
                           <p class="text-gray-600" x-text="booking.RoomNumber"></p>
                            <div>
                                <p class="text-gray-700" x-text="booking.checkInDate"></p>
                                <p class="text-gray-700" x-text="booking.checkOutDate"></p>   
                            </div>
                            <h2 class="font-semibold" x-text="booking.totalPrice"></h2>
                            <h5 class="text-gray-200 font-semibold" x-text="booking.createdAt"></h5>
                           </div>
                       </template>
                   </div>

                   <div class="flex justify-center mt-4 space-x-2">
                        <button @click="$store.globalState.setPage('bookings', $store.globalState.bookingsPagination.page - 1)"
                        :disabled="$store.globalState.bookingsPagination.page === 1"
                        class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50"
                        >
                        Prev
                        </button>

                        <template x-for="i in $store.globalState.totalPages('bookings')" :key="i">
                            <button @click="$store.globalState.setPage('bookings', i)"
                            :class="{'bg-blue-600 text-white': $store.globalState.bookingsPagination.page === i, 'bg-gray-300': $store.globalState.bookingsPagination.page !== i}"
                            class="px-3 py-1 rounded"
                            >
                            <span x-text="i"></span>
                            </button>
                        </template>

                        <button @click="$store.globalState.setPage('bookings', $store.globalState.bookingsPagination.page + 1)"
                        :disabled="$store.globalState.bookingsPagination.page === $store.globalState.totalPages('bookings')"
                        class="px-3 py-1 bg-gray-300 rounded disabled:opacity-50"
                        >
                            Next
                        </button>
                    </div>

               </template>
           </div>

        </section>
    </main>





<!-- login Modal -->
<div x-data="loginModal()">
    <div x-show="$store.globalState.loginModalOpen" x-transition @click="close()" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display:none">
        <div @click.stop x-show="$store.globalState.loginModalOpen" x-transition class="bg-white rounded-lg w-96 p-6 shadow-lg text-gray-800 z-50">
            <button @click="close()" class="float-right text-gray-500 hover:text-gray-900">&times;</button>
    
            <div class="mb-4 border-b flex space-x-4">

                <button
                :class="activeTab === 'register'
                ? 'border-b-2 border-blue-600 text-blue-600'
                : 'text-gray-600'"
                @click="activeTab = 'register'"
                class="pb-2 font-semibold"
                >
                    Реєстрація
                </button>

                <button
                :class="activeTab === 'login'
                ? 'border-b-2 border-blue-600 text-blue-600'
                : 'text-gray-600'"
                @click="activeTab = 'login'"
                class="pb-2 font-semibold"
                >
                    Вхід
                </button>

            </div>

            <template x-if="activeTab === 'register'">
                <form @submit.prevent="submit()">
                    <label class="block mb-1">Email</label>
                    <input x-model="registerForm.Credential" type="email" required class="w-full border rounded px-3 py-2 mb-3"/>
                    <label class="block mb-1">Пароль</label>
                    <input x-model="registerForm.Password" type="password" required class="w-full border rounded px-3 py-2 mb-3"/>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Зареєструватися</button>
                </form>
            </template>

            <template x-if="activeTab === 'login'">
                <form @submit.prevent="submit()">
                    <label class="block mb-1">Email</label>
                    <input x-model="loginForm.Credential" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    <label class="block mb-1">Пароль</label>
                    <input x-model="loginForm.Password" type="password" required class="w-full border rounded px-3 py-2 mb-3"/>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Увійти</button>
                </form>
            </template>
        </div>
    </div>
</div>


<!-- Add Modal -->
<div x-data="addModal()">
    <div x-show="$store.globalState.addModalOpen" x-transition @click="close()" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display:none">
        <div @click.stop x-show="$store.globalState.addModalOpen" x-transition class="bg-white rounded-lg w-96 p-6 shadow-lg text-gray-800 z-50">
            <button @click="close()" class="float-right text-gray-500 hover:text-gray-900">&times;</button>
            
            <template x-if="getActiveTab() === 'hotels'">
                <form @submit.prevent="submit()">
                    <label class="block mb-1">Name</label>
                    <input x-model="addForm.Name" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Country</label>
                    <input x-model="addForm.Country" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">City</label>
                    <input x-model="addForm.City" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Street</label>
                    <input x-model="addForm.Street" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Building</label>
                    <input x-model="addForm.Building" type="text" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">ZipCode</label>
                    <input x-model="addForm.ZipCode" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Description</label>
                    <textarea x-model="addForm.Description" class="w-full border rounded px-3 py-2 mb-3"></textarea>
    
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
                </form>
            </template>
                
            <template x-if="getActiveTab() === 'rooms'">
                <form @submit.prevent="submit()">
                    <select x-model="addForm.HotelId" class="w-full border rounded px-3 py-2 mb-3">
                        <option value="">Select hotel</option>
                        <template x-for="hotel in $store.globalState.hotels" :key="hotel.id">
                            <option :value="hotel.id" x-text="hotel.name"></option>
                        </template>
                    </select>
                    
                    <label class="block mb-1">Number</label>
                    <input x-model="addForm.Number" type="number" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Capacity</label>
                    <input x-model="addForm.Capacity" type="number" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Price per Night</label>
                    <input x-model="addForm.PricePerNight" type="number" required class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
                </form>
            </template>
    
        </div>
    </div>
</div>


<!-- Update Modal -->
<div x-data="updateModal()">
    <div x-show="$store.globalState.updateModalOpen" x-transition @click="close()" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display:none">
        <div @click.stop x-show="$store.globalState.updateModalOpen" x-transition class="bg-white rounded-lg w-96 p-6 shadow-lg text-gray-800 z-50">
            <button @click="close()" class="float-right text-gray-500 hover:text-gray-900">&times;</button>

            <template x-if="getActiveTab() === 'hotels'">
                <form @submit.prevent="submit()">
                    <label class="block mb-1">Name</label>
                    <input x-model="updateForm.name" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Country</label>
                    <input x-model="updateForm.country" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">City</label>
                    <input x-model="updateForm.city" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Street</label>
                    <input x-model="updateForm.street" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Building</label>
                    <input x-model="updateForm.building" type="text" class="w-full border rounded px-3 py-2 mb-3"/>

                    <label class="block mb-1">ZipCode</label>
                    <input x-model="updateForm.zipCode" type="text" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Description</label>
                    <textarea x-model="updateForm.description" class="w-full border rounded px-3 py-2 mb-3"></textarea>
                    
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
                </form>
            </template>
            
            <template x-if="getActiveTab() === 'rooms'">
                <form @submit.prevent="submit()">
                    <label class="block mb-1">Capacity</label>
                    <input x-model="updateForm.capacity" type="number" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <label class="block mb-1">Price per Night</label>
                    <input x-model="updateForm.pricePerNight" type="number" class="w-full border rounded px-3 py-2 mb-3"/>
                    
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
                </form>
            </template>
        </div>
    </div>
</div>


<!-- Booking Modal -->
<div x-data="bookingModal()">
    <div x-show="$store.globalState.bookingModalOpen" x-transition @click="close()" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display:none">
        <div @click.stop x-show="$store.globalState.bookingModalOpen" x-transition class="bg-white rounded-lg w-96 p-6 shadow-lg text-gray-800 z-50">
            <button @click="close()" class="float-right text-gray-500 hover:text-gray-900">&times;</button>

            <h2 class="text-lg font-semibold mb-4">Booking room</h2>
            <form @submit.prevent="submit()">
                <label class="block mb-2">Check-in</label>
                <input type="date" x-model="bookingForm.bookingCheckIn" class="w-full border rounded px-3 py-2 mb-3"/>
        
                <label class="block mb-2">Check-out</label>
                <input type="date" x-model="bookingForm.bookingCheckOut" class="w-full border rounded px-3 py-2 mb-3"/>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Confirm</button>
            </form>
        </div>
    </div>
</div>


</body>
</html>
